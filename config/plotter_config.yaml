# =============================================================================
# plotter_config.yaml -- Ctcf_WT vs Ctcf_KO differential Hi-C
# 2026-May-5, migrated to the ordered-tracks schema 2026-Jul-27
#
# ASCII only (execution locale is often C): no accents, even in comments.
# A single non-ASCII byte silently truncates this file when parsed by Rscript.
#
# Usage:
#   Rscript plotterHiC.r config/plotter_config.yaml
#       one figure per entry in global.loci
#
#   Rscript plotterHiC.r config/plotter_config.yaml chr7:4000000-4900000 Tnni3
#       single figure; the CLI region and name override global.loci
#
# ORDER IS DECLARATION ORDER: heatmaps follow hic.panels, tracks follow
# tracks.list (first = top). There are no y coordinates to keep in sync; a
# track only has a `height`, and `tracks.spacing` separates consecutive ones.
# =============================================================================

global:
  genome: mm10
  resolution: 10000             # default; a file may override it in hic.files
  padding_fraction: 0.333

  loci:
    Tnni3: chr7:4000000-4900000
    # Lbr:     chr1:181700000-182200000
    # Abcb10:  chr8:123500000-124050000
    # Rac2:    chr15:78200000-78750000
    # Erg:     chr16:95300000-95900000
    # Nos3:    chr5:24250000-24600000
    # Hba-a1:  chr11:32100000-32350000
    # Myl4:    chr11:104100000-104800000
    # Tnnc1:   chr14:30800000-31500000
    # Nexn:    chr3:152000000-152800000
    # Myl7:    chr11:5200000-6000000
    # Actn2:   chr13:12000000-12800000

  output:
    dir: /Users/amaury/lastHiC_analysis/plots_rplotter
    formato: png
    plot_width: 10              # cm
    plot_height: 15             # cm
    dpi: 500

hic:
  norm: KR

  # A bare path inherits global.resolution and hic.norm. Use a map instead to
  # give one file its own settings, e.g.
  #   Ctcf_KO: { file: /path/x.hic, resolution: 5000, norm: SCALE }
  files:
    Ctcf_WT: /Users/amaury/lines/mouse/endothelial_Cells/juicer/Ctcf_WT.allReps.896MvP.hic
    Ctcf_KO: /Users/amaury/lines/mouse/endothelial_Cells/juicer/Ctcf_KO.allReps.896MvP.hic

  defaults:
    height: 1

  legend_defaults:
    show: true
    position: [-0.08, 0.5]
    direction: vertical
    title_size: 5
    text_size: 5
    key_height: 7
    key_width: 5

  # A comparison is read as "hic <op> vs", so the third panel is KO - WT.
  panels:
    - { name: Ctcf_WT,             hic: Ctcf_WT,                 matrix: log2,        min: 3,   max: 12 }
    - { name: Ctcf_KO,             hic: Ctcf_KO,                 matrix: log2,        min: 3,   max: 12 }
    - { name: "Ctcf-KO - Ctcf-WT", hic: Ctcf_KO, vs: Ctcf_WT,    matrix: subtraction, min: -40, max: 30 }

tracks:
  panel_height: 2.5             # the track panel vs one heatmap
  spacing: 0.15                 # gap between consecutive tracks
  label_size: 6

  defaults:
    mark:
      height: 1
      n_bins: 300
      crop: true
      color: grey50
      alpha: 0.9
      line_color: black
      line_width: 0.2
      show_scale: true

    annotation:
      height: 1
      style: box
      feature_height: 0.25
      direction: triangle
      arrow_frac: 0.006
      line_color: black
      line_width: 0.2
      labels:
        enabled: false
        size: 2
        fontface: bold
        repel: true
        dedup: true

  # ---------------------------------------------------------------------------
  # Top to bottom. `signal_scale` multiplies log10(1 + signal); 'auto' would
  # instead rescale each track to fill its own band at every locus.
  # ---------------------------------------------------------------------------
  list:

    Genes:
      type: annotation
      file: /Users/amaury/genes/mm10.gene.track.sym.sorted.bed
      height: 0.6
      feature_height: 0.06
      jitter: 0.5

    DEGs:
      type: annotation
      file: /Users/amaury/genes/Ctcf_WT_KO.DEGs.filtered_by_Tie2_ATAC.Accesible_Inaccesible.genebody.bed
      height: 1
      feature_height: 0.3
      jitter: 0.8
      labels:
        enabled: true
        size: 2
        max_n: 20
        min_width_frac: 0

    ATAC_WT:
      type: mark
      file: /Users/amaury/toronto_CUTNTag/bigwigs_ATAC_hisat2/ys211.ATACseq.WT.trim_Ad_3pb.h2.0_120pb.scaleFact.bw
      color: black
      signal_scale: 1           # ATACseq is tall enough on its own
      n_bins: 400

    ATAC_KO:
      type: mark
      file: /Users/amaury/toronto_CUTNTag/bigwigs_ATAC_hisat2/ys300.ATACseq.Ctcf_KO.trim_Ad_3pb.h2.0_120pb.scaleFact.bw
      color: black
      signal_scale: 1
      n_bins: 400

    RNAseq_WT:
      type: mark
      file: /Users/amaury/toronto_CUTNTag/bigwigs_normalized_by_SF/rnaseq.Ctcf_WT.trim.paired.star.scaleFact.bw
      color: pink4
      signal_scale: 4           # kept short so it does not dominate the plot

    RNAseq_KO:
      type: mark
      file: /Users/amaury/toronto_CUTNTag/bigwigs_normalized_by_SF/rnaseq.Ctcf_KO.trim.single.star.scaleFact.bw
      color: pink4
      signal_scale: 4

    H3K4me3:
      type: mark
      file: /Users/amaury/toronto_CUTNTag/bigwigs_normalized_by_SF/H3K4me3.Ctcf_WT.trim_Ad_3pb.h2.scaleFact.bw
      color: orange1
      signal_scale: 8

    H3K4me1:
      type: mark
      file: /Users/amaury/toronto_CUTNTag/bigwigs_normalized_by_SF/H3K4me1.Ctcf_WT.trim_Ad_3pb.h2.scaleFact.bw
      color: yellow4
      signal_scale: 30

    H3K27ac:
      type: mark
      file: /Users/amaury/toronto_CUTNTag/bigwigs_normalized_by_SF/H3K27ac.Ctcf_WT.ys204_ys240.trim_Ad_3pb.h2.scaleFact.bw
      color: green4
      signal_scale: 100

    H3K27me3:
      type: mark
      file: /Users/amaury/toronto_CUTNTag/bigwigs_normalized_by_SF/H3K27me3.Ctcf_WT.trim_Ad_3pb.h2.scaleFact.bw
      color: red3
      signal_scale: 20

    CTCF:
      type: mark
      file: /Users/amaury/toronto_CUTNTag/bigwigs_normalized_by_SF/Ctcf.Ctcf_WT.ys115_ys200.trim_Ad_3pb.h2.scaleFact.bw
      color: blue3
      signal_scale: 70
      n_bins: 400

    CTCF Sense:
      type: annotation
      file: /Users/amaury/toronto_CUTNTag/only_CTCF_motifs/CTCF_MA0139_MA1929_MA1930.meme/Ctcf.ATACseq/Ctcf.ATACseq.Ctcf_WT_KO.Ctcf_motifs.plus_minus.1kb_extended.bed
      height: 1
      feature_height: 0.2
      jitter: 0.8

# Marks listed together share one y scale, so their heights are comparable.
shared_yaxis_groups:
  ATACseq: [ATAC_WT, ATAC_KO]
  RNAseq:  [RNAseq_WT, RNAseq_KO]

plot:
  x_axis:
    divide: 1000000             # axis labels in Mb
  # crop:                       # how much of the rotated square to keep
  #   x: [0.2, 0.8]
  #   y: 0.7
