# plotterHiC_ysEC.yaml -- Ctcf-WT vs Ctcf-KO differential Hi-C
#
# Usage:
#   Rscript plotterHiC.r config/plotterHiC_ysEC.yaml
#       one figure per entry in global.loci
#
#   Rscript plotterHiC.r config/plotterHiC_ysEC.yaml chr2:112225000-114225000 Actc1
#       single figure; the CLI region and name override global.loci
# -----------------------------------------------------------------


